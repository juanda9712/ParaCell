<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | ParaCell</title>

    <!-- Favicon (Icono de la pestaña) -->
    <link rel="icon" type="image/png" href="assets/img/ParaCell.png">
    
    <!-- Fuentes y Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <!-- Supabase JS (Librería oficial para conectarnos a la base de datos) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Pantalla de Login (Se ocultará al iniciar sesión) -->
    <div id="login-section" class="min-h-screen flex items-center justify-center bg-gray-900">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Acceso Administrador</h2>
                <p class="text-sm text-gray-500 mt-2">Ingresá tus credenciales de ParaCell</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-xl transition-all">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <!-- Panel Principal (Oculto por defecto hasta hacer login) -->
    <div id="admin-panel" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Menú Lateral (Sidebar) -->
        <aside class="w-full md:w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <img src="assets/img/ParaCell.png" alt="ParaCell Logo" class="h-16 w-auto object-contain">
                </h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center gap-3 bg-brand-600 text-white px-4 py-3 rounded-xl transition-colors">
                    <i class="fa-solid fa-box w-5"></i> Productos
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-400 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-xl transition-colors">
                    <i class="fa-solid fa-wrench w-5"></i> Problemas Técnicos
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button id="btn-logout" class="w-full flex items-center gap-3 text-gray-400 hover:text-red-400 px-4 py-2 transition-colors">
                    <i class="fa-solid fa-right-from-bracket w-5"></i> Cerrar sesión
                </button>
            </div>
        </aside>
        <!-- Contenedor principal -->
        <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            
            <!-- === BARRA DE NAVEGACIÓN SUPERIOR DEL ADMIN === -->
            <nav class="bg-white border border-gray-200 rounded-xl mb-8 sticky top-2 z-40 px-4 py-3 shadow-sm">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <img src="assets/img/ParaCell.png" alt="Logo" class="h-8 w-auto object-contain">
                        <span class="font-bold text-gray-800 border-l border-gray-300 pl-3 ml-2 hidden sm:block">Panel de Control</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-brand-600 transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-store"></i> <span class="hidden sm:inline">Ver Tienda</span>
                        </a>
                    </div>
                </div>
            </nav>
            
            <!-- Cabecera del Admin (Se adapta en móviles) -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 sm:mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Inventario de Productos</h1>
                    <p class="text-sm text-gray-500">Gestiona tu catálogo, precios y fotografías.</p>
                </div>
                <!-- En celular el botón ocupa el 100% (w-full), en PC se ajusta (sm:w-auto) -->
                <button id="btn-abrir-modal" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-5 rounded-lg shadow-sm flex items-center justify-center gap-2 transition-colors">
                    <i class="fa-solid fa-plus"></i> Nuevo Producto
                </button>
            </div>

            <!-- Contenedor de la Tabla Responsive -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <!-- AQUÍ ESTÁ LA MAGIA: overflow-x-auto permite hacer scroll horizontal en la tabla -->
                <div class="overflow-x-auto">
                    <table class="w-full whitespace-nowrap text-left text-sm min-w-[600px]">
                        <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 uppercase text-xs font-semibold">
                            <tr>
                                <th class="px-6 py-4">Producto</th>
                                <th class="px-6 py-4">Categoría</th>
                                <th class="px-6 py-4">Precio</th>
                                <th class="px-6 py-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos" class="divide-y divide-gray-100">
                            <!-- Las filas se inyectan con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <!-- Modal para Nuevo Producto (Oculto por defecto) -->
    <div id="modal-producto" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <!-- max-h-[90vh] y overflow-y-auto evitan que el modal se salga de la pantalla en móviles -->
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl">
            
            <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-4">
                <h3 class="text-xl font-bold text-gray-900">Agregar Nuevo Producto</h3>
                <button id="btn-cerrar-modal" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Aquí adentro va tu <form id="form-producto"> que ya tienes -->
            <form id="form-producto" class="space-y-4 sm:space-y-5">
               <!-- ... Deja el contenido de tu formulario exactamente igual ... -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Producto</label>
                        <input type="text" id="prod-nombre" required placeholder="Ej: iPhone 13 Pro Max" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                        <input type="text" id="prod-marca" required placeholder="Ej: Apple" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                        <select id="prod-categoria" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="Celulares">Celulares</option>
                            <option value="Accesorios">Accesorios</option>
                            <option value="Informática">Informática</option>
                            <option value="Repuestos">Repuestos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Normal (Gs.)</label>
                        <input type="number" id="prod-precio" required placeholder="Ej: 5000000" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Oferta (Opcional)</label>
                        <input type="number" id="prod-oferta" placeholder="Dejar vacío si no hay" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fotos del Producto (Hasta 3)</label>
                        <!-- Agregamos la palabra "multiple" y le quitamos el "required" para controlarlo con JS -->
                        <input type="file" id="prod-imagen" accept="image/*" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
                        
                        <!-- Contenedor donde aparecerán las miniaturas -->
                        <div id="preview-prod-fotos" class="mt-3 flex flex-wrap gap-3 hidden"></div>
                    </div>
                </div>
                <div class="pt-4 flex justify-end gap-3 border-t border-gray-100 mt-6">
                    <button type="button" id="btn-cancelar" class="px-5 py-2.5 text-gray-600 font-medium hover:bg-gray-100 rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" id="btn-guardar-prod" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-save"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de configuración y conexión -->
    <script src="js/admin.js"></script>
</body>
</html>
